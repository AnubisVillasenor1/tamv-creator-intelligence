name: TAMV Creator Intelligence CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamv-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint, certification, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: 1.3.5

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and regression tests
        run: bun run test

      - name: Verify PostgreSQL ledger probe safety guards
        run: bun run test:ledger-guard

      - name: Test static audit-ledger ordering detector
        run: python3 scripts/test-audit-migration-validator.py

      - name: Validate audit-ledger migration invariants (advisory)
        run: python3 scripts/validate-audit-migration.py

      - name: Validate governance receipt SQL invariants
        run: node scripts/validate-governance-receipts-sql.mjs

      - name: Validate capability closure inventory
        run: node scripts/validate-closure-inventory.mjs

      - name: Test documentation link validator
        run: bun run docs:check:test

      - name: Validate maintained documentation references
        run: bun run docs:check

      - name: Test secret-safe production environment preflight
        run: bun run ops:preflight:test

      - name: Report deployment configuration gaps without exposing values
        run: bun run ops:preflight

      - name: Lint source and scripts
        run: bun run lint

      - name: Validate TAMV pack and skill contracts
        run: bun run tamv:check

      - name: Build production application
        run: bun run build
