name: TAMV Creator Intelligence CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamv-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint, certification, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: 1.3.5

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and regression tests
        run: bun run test

      - name: Verify PostgreSQL ledger probe safety guards
        run: bun run test:ledger-guard

      - name: Test capability closure drift guards
        run: bun run ops:closure:test

      - name: Validate capability evidence and registry coverage
        run: bun run ops:closure

      - name: Lint source and scripts
        run: bun run lint

      - name: Validate TAMV pack and skill contracts
        run: bun run tamv:check

      - name: Build production application
        run: bun run build
