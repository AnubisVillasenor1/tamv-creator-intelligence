name: TAMV Creator Intelligence CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamv-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint, certification, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: 1.3.5

      - name: Install Node for Genesis contract tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate Security and Trust governance pack
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r security-trust/governance-pack-v2/requirements-validation.txt
          python3 -m py_compile security-trust/governance-pack-v2/mcp_server/fixtures.py security-trust/governance-pack-v2/mcp_server/tamv_audit_mcp.py security-trust/governance-pack-v2/scripts/validate_pack.py security-trust/governance-pack-v2/scripts/validate_handoff.py security-trust/governance-pack-v2/scripts/generate_manifest.py
          python3 -m unittest discover -s security-trust/governance-pack-v2/tests -v
          python3 security-trust/governance-pack-v2/scripts/validate_pack.py
          python3 security-trust/governance-pack-v2/scripts/validate_handoff.py
          python3 security-trust/governance-pack-v2/scripts/generate_manifest.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("security-trust/governance-pack-v2")
          manifest = json.loads((root / "MANIFEST.sha256.json").read_text())
          assert manifest["integrity_only_not_signature"] is True
          for name, item in manifest["files"].items():
              data = (root / name).read_bytes()
              assert len(data) == item["bytes"], name
              assert hashlib.sha256(data).hexdigest() == item["sha256"], name
          print(f"Manifest verified: {len(manifest['files'])} files")
          PY

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and regression tests
        run: bun run test

      - name: Run Genesis contract and engine tests
        working-directory: tamv-genesis
        run: node --experimental-strip-types --test tests/*.test.ts

      - name: Verify PostgreSQL ledger probe safety guards
        run: bun run test:ledger-guard

      - name: Test static audit-ledger ordering detector
        run: python3 scripts/test-audit-migration-validator.py

      - name: Enforce Hyper-Core audit-ledger serialization and SECURITY DEFINER invariants
        run: python3 scripts/validate-audit-migration.py --strict-order

      - name: Validate governance receipt SQL invariants
        run: node scripts/validate-governance-receipts-sql.mjs

      - name: Validate pack manifest contracts
        run: python3 tamv-pack/scripts/validate-manifest.py

      - name: Verify pack Git-blob integrity inventory
        run: python3 tamv-pack/scripts/validate-integrity.py

      - name: Validate capability closure states and evidence
        run: node scripts/validate-capability-closure.mjs

      - name: Test capability closure validator
        run: bun run ops:closure:test

      - name: Validate capability closure inventory
        run: node scripts/validate-closure-inventory.mjs

      - name: Test documentation link validator
        run: bun run docs:check:test

      - name: Validate maintained documentation references
        run: bun run docs:check

      - name: Test secret-safe production environment preflight
        run: bun run ops:preflight:test

      - name: Report deployment configuration gaps without exposing values
        run: bun run ops:preflight

      - name: Lint source and scripts
        run: bun run lint

      - name: Typecheck source
        run: bun run typecheck

      - name: Validate TAMV pack and skill contracts
        run: bun run tamv:check

      - name: Validate repository hygiene
        run: python3 scripts/validate-repo-hygiene.py

      - name: Build production application
        run: bun run build
