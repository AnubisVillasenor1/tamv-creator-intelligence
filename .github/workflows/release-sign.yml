name: TAMV Certified Release (Ed25519 + SBOM + Provenance)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: tamv-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-sign-build:
    name: Verify, sign, attest and build certified release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout tagged source (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a release tag pointing to main history
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Release tag must point to a commit reachable from origin/main."
            exit 1
          fi

      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.5"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Validate pack structure before rehash
        run: |
          set -euo pipefail
          python3 tamv-pack/scripts/validate-manifest.py
          python3 tamv-pack/scripts/validate-integrity.py
          bash tamv-pack/scripts/validate-pack.sh
          bash tamv-pack/scripts/test-scripts.sh

      - name: Require release signing secrets
        shell: bash
        env:
          TAMV_ATTRIBUTION_PRIVATE_KEY: ${{ secrets.TAMV_ATTRIBUTION_PRIVATE_KEY }}
          TAMV_ATTRIBUTION_PUBLIC_KEY: ${{ secrets.TAMV_ATTRIBUTION_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$TAMV_ATTRIBUTION_PRIVATE_KEY" || { echo "::error::Missing repository secret TAMV_ATTRIBUTION_PRIVATE_KEY"; exit 1; }
          test -n "$TAMV_ATTRIBUTION_PUBLIC_KEY" || { echo "::error::Missing repository secret TAMV_ATTRIBUTION_PUBLIC_KEY"; exit 1; }

      - name: Run tests and lint
        run: |
          set -euo pipefail
          bun run test
          bun run lint

      - name: Recalculate source hashes and invalidate old signature
        run: bun run tamv:hash

      - name: Validate updated source inventory and 37-skill pack
        run: bun run tamv:check

      - name: Sign manifest with Ed25519
        env:
          TAMV_ATTRIBUTION_PRIVATE_KEY: ${{ secrets.TAMV_ATTRIBUTION_PRIVATE_KEY }}
          TAMV_ATTRIBUTION_PUBLIC_KEY: ${{ secrets.TAMV_ATTRIBUTION_PUBLIC_KEY }}
        run: bun run tamv:sign

      - name: Verify signature and hashes fail-closed
        env:
          TAMV_ATTRIBUTION_PUBLIC_KEY: ${{ secrets.TAMV_ATTRIBUTION_PUBLIC_KEY }}
          TAMV_CERTIFICATION_REQUIRED: "true"
        run: bun run tamv:verify

      - name: Build certified production output
        env:
          TAMV_ATTRIBUTION_PUBLIC_KEY: ${{ secrets.TAMV_ATTRIBUTION_PUBLIC_KEY }}
          TAMV_CERTIFICATION_REQUIRED: "true"
        run: bun run build

      - name: Re-verify release inputs after build
        env:
          TAMV_ATTRIBUTION_PUBLIC_KEY: ${{ secrets.TAMV_ATTRIBUTION_PUBLIC_KEY }}
          TAMV_CERTIFICATION_REQUIRED: "true"
        run: bun run tamv:verify

      - name: Prepare release metadata directory
        run: mkdir -p release-artifacts dist .output

      - name: Generate CycloneDX SBOM (pinned Syft action)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          syft-version: v1.33.0
          output-file: release-artifacts/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Package certified release and checksum
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          safe_tag="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '_')"
          archive="release-artifacts/tamv-creator-intelligence-$safe_tag.tar.gz"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - \
            tamv-attribution.json \
            tamv-attribution.sig \
            dist \
            .output \
            release-artifacts/sbom.cdx.json | gzip -n > "$archive"
          sha256sum "$archive" > "$archive.sha256"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Attest release bundle build provenance (SLSA)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.bundle.outputs.archive }}

      - name: Attest CycloneDX SBOM for release bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.bundle.outputs.archive }}
          sbom-path: release-artifacts/sbom.cdx.json

      - name: Verify generated build provenance against repository, workflow and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "${{ steps.bundle.outputs.archive }}" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-sign.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF"

      - name: Verify generated CycloneDX SBOM attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "${{ steps.bundle.outputs.archive }}" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://cyclonedx.org/bom \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-sign.yml"

      - name: Publish signed build, SBOM, attestations and checksum as workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tamv-creator-intelligence-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 90
          path: |
            tamv-attribution.json
            tamv-attribution.sig
            release-artifacts/
