name: TAMV Creator Intelligence CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creator-intelligence-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, policy, package integrity and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Install Node for Genesis contract tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Unit and integration tests
        run: bun run test

      - name: Run Genesis contract and engine tests
        working-directory: tamv-genesis
        run: node --experimental-strip-types --test tests/*.test.ts

      - name: Static lint
        run: bun run lint

      - name: Gate approved release digest
        env:
          TAMV_RELEASE_MANIFEST_SHA256: ${{ vars.TAMV_RELEASE_MANIFEST_SHA256 }}
        run: bun run tamv:digest-gate

      - name: Validate TAMV certification and package
        run: bun run tamv:check

      - name: Validate governance receipt SQL invariants
        run: node scripts/validate-governance-receipts-sql.mjs

      - name: Validate pack manifest contracts
        run: python3 tamv-pack/scripts/validate-manifest.py

      - name: Verify pack Git-blob integrity inventory
        run: python3 tamv-pack/scripts/validate-integrity.py

      - name: Validate capability closure states and evidence
        run: node scripts/validate-capability-closure.mjs

      - name: Test capability closure validator
        run: bun run ops:closure:test

      - name: Validate closure inventory against repository evidence
        run: node scripts/validate-closure-inventory.mjs

      - name: Test static audit-ledger ordering detector
        run: python3 scripts/test-audit-migration-validator.py

      - name: Validate audit-ledger migration invariants (advisory)
        run: python3 scripts/validate-audit-migration.py

      - name: Enforce concise README policy
        run: bun run readme:check

      - name: Test documentation link validator
        run: bun run docs:check:test

      - name: Validate maintained documentation references
        run: bun run docs:check

      - name: Production build
        run: bun run build
