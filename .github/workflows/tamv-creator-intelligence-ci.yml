name: TAMV Creator Intelligence CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/aidp-governance-evidence]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creator-intelligence-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, policy, package integrity and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Unit and integration tests
        run: bun run test

      - name: Static lint
        run: bun run lint

      - name: Validate TAMV certification and package
        run: bun run tamv:check

      - name: Production build
        run: bun run build
