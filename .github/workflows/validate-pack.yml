name: Validate TAMV Pack and Application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Check repository hygiene
        run: python3 scripts/validate-repo-hygiene.py

      - name: Validate TAMV source hashes and release manifest
        run: node scripts/tamv-certification.mjs --check

      - name: Validate TAMV package
        run: bash tamv-pack/scripts/validate-pack.sh

      - name: Test installation and tamper rejection
        run: bash tamv-pack/scripts/test-scripts.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Lint shell scripts
        shell: bash
        run: find tamv-pack -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Lint application
        run: bun run lint

      - name: Run unit and routing tests
        run: bun run test

      - name: Build production application
        run: bun run build
