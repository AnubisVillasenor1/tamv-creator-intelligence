name: Validate TAMV Pack and Application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node for Web Crypto and Genesis tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.16.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Check repository hygiene
        run: python3 scripts/validate-repo-hygiene.py

      - name: Enforce Hyper-Core audit-ledger safeguards in CI
        run: python3 scripts/validate-audit-migration.py --strict-order

      - name: Test static audit-ledger ordering detector
        run: python3 scripts/test-audit-migration-validator.py

      - name: Test hardened local hooks and staged-secret detection
        run: bun run hooks:test

      - name: Test GitHub and offline SLSA verification modes
        run: bun run slsa:test

      - name: Validate TAMV source hashes and release manifest
        run: node scripts/tamv-certification.mjs --check

      - name: Validate TAMV package
        run: bash tamv-pack/scripts/validate-pack.sh

      - name: Verify generated skill registry matches contracts
        run: node tamv-pack/scripts/generate-skill-registry.mjs --check

      - name: Verify skills.sh discovery and groupings
        run: node scripts/validate-skills-sh.mjs

      - name: Run Genesis evidence kernel tests
        run: node --experimental-strip-types --test tamv-genesis/tests/*.test.ts

      - name: Verify v3 pack seal structure and content
        run: node --experimental-strip-types tamv-genesis/cli/sovereign.mjs seal

      - name: Verify append-only v3 transparency chain and checkpoint
        run: node --experimental-strip-types tamv-genesis/scripts/v3-transparency.mjs --verify

      - name: Test installation and tamper rejection
        run: bash tamv-pack/scripts/test-scripts.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Lint shell scripts
        shell: bash
        run: find tamv-pack -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Lint application
        run: bun run lint

      - name: Run unit and routing tests
        run: bun run test

      - name: Test provider-neutral SDK and execution permits
        run: node --test sdk/tests/*.test.mjs

      - name: Build production application
        run: bun run build
