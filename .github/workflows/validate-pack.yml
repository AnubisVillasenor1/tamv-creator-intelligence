name: Validate TAMV Pack and Application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node for Web Crypto and Genesis tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.16.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Check repository hygiene
        run: python3 scripts/validate-repo-hygiene.py

      - name: Test hardened local hooks and staged-secret detection
        run: bun run hooks:test

      - name: Test GitHub and offline SLSA verification modes
        run: bun run slsa:test

      - name: Validate TAMV source hashes and release manifest
        run: node scripts/tamv-certification.mjs --check

      - name: Validate TAMV package
        run: bash tamv-pack/scripts/validate-pack.sh

      - name: Verify generated skill registry matches contracts
        run: node tamv-pack/scripts/generate-skill-registry.mjs --check

      - name: Run Genesis evidence kernel tests
        run: node --experimental-strip-types --test tamv-genesis/tests/*.test.ts

      - name: Test installation and tamper rejection
        run: bash tamv-pack/scripts/test-scripts.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Lint shell scripts
        shell: bash
        run: find tamv-pack -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Lint application
        run: bun run lint

      - name: Run unit and routing tests
        run: bun run test

      - name: Build production application
        run: bun run build
